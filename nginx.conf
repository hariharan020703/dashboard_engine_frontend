# The one origin the browser talks to, in the Docker deployment.
#
# Without this, the ADK API and the Mojo agent are separate origins the browser
# calls directly: every one needs a host-reachable URL baked into the bundle and
# a CORS allow-list that includes this app. Routing them through here makes all
# three backends same-origin, so the bundle holds relative paths only and works
# unchanged on whatever host the stack is deployed to.
#
# Upstreams are resolved per request through Docker's DNS (127.0.0.11) rather
# than at startup, so nginx still starts - and still serves the SPA - while a
# backend container is down or restarting. Hence `set $upstream` + `rewrite`
# instead of a plain `proxy_pass http://host/`.

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # Artifact uploads (ADK) and file uploads (Mojo).
    client_max_body_size 100m;

    # Shared by every proxied location. Buffering is off because two of these
    # stream: ADK chat is SSE, Mojo's messages are NDJSON - a buffered proxy
    # delivers the whole stream at the end. The long read timeout is for ADK's
    # `stream: false` extraction run, which holds one request open for the
    # whole run.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_buffering         off;
    proxy_cache             off;
    proxy_request_buffering off;
    proxy_read_timeout      3600s;
    proxy_send_timeout      3600s;

    # Express backend. Path kept as-is: its routes live under /api, and the
    # refresh cookie is scoped to Path=/api/auth.
    location /api/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
    }

    # Elze-backend ADK Agent Runtime API. Prefix stripped: its routes start at
    # /workspaces/... and /health.
    location /svc/adk/ {
        set $adk http://adk-api:8300;
        rewrite ^/svc/adk/(.*)$ /$1 break;
        proxy_pass $adk;
    }

    # Mojo Analyst Agent. Prefix stripped: its routes start at /sessions, ...
    location /svc/mojo/ {
        set $mojo http://mojo-agent:8080;
        rewrite ^/svc/mojo/(.*)$ /$1 break;
        proxy_pass $mojo;
    }

    # The SPA. Hashed assets are immutable; index.html must never be cached,
    # or a deploy leaves browsers asking for asset hashes that no longer exist.
    root /usr/share/nginx/html;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
